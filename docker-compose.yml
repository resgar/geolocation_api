services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - geolocation_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0"]
    volumes:
      - .:/rails
      - geolocation_api_bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      GEOLOCATION_PROVIDER: ${GEOLOCATION_PROVIDER:-ipstack}
      API_TOKEN: ${API_TOKEN}
      IPSTACK_API_KEY: ${IPSTACK_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  geolocation_api_postgres:
  geolocation_api_bundle:
